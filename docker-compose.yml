version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: proctor_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - proctor_network

  server:
    build: ./server
    container_name: proctor_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/proctor-ai
      - JWT_SECRET=production_jwt_secret_value_key_for_proctor_ai_9988
      - JWT_EXPIRE=7d
      - NODE_ENV=production
      - CLIENT_URL=http://localhost
    depends_on:
      - mongo
    networks:
      - proctor_network

  client:
    build: ./client
    container_name: proctor_client
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - proctor_network

volumes:
  mongodb_data:

networks:
  proctor_network:
    driver: bridge
